# for cookie consent
cookie_consent:
  privacy_policy_link_text: *privacy_policy_title
  side_nav_setting_button_tooltip: &cookie_settings Cookie 設定
  panel_bar:
    msg: >
      本網站使用 Cookie 最佳化網站功能。
      獲得您的同意下後將會啟用。
    privacy_msg: 查看 $privacy_link。
    buttons:
      accept: &accept_button 全部允許
      settings: 自訂
      deny: &deny_button 拒絕
      close: 關閉
  panel_settings:
    title: *cookie_settings
    msg: >
      本網站使用 Cookie 最佳化網站功能。
      獲得您的同意下後將會啟用。請點擊下方的各個項目以瞭解 Cookie 政策。
    privacy_msg: 查看 $privacy_link。
    buttons:
      accept: *accept_button
      save: 允許選取項目
      deny: *deny_button
    always_active: 一律啟用
    consent_types:
      necessary:
        title: 絕對必要的 Cookie
        info: >
          這些 Cookie 是網站功能所必需的，無法停用。
          這些 Cookie 不會儲存任何可識別個人身分的資訊。
          它們通常會在網站功能（例如佈景主題）變更時設定。
          $gtag_info
      analytics:
        title: 效能與分析 Cookie #Performance and analytics cookies
        info: $gtag_info
      preferences:
        title: 功能 Cookie
        info: $gtag_info
      advertising:
        title: 定位與廣告 Cookie
        info: $gtag_info
    gtag_info:
      # from https://support.google.com/tagmanager/answer/10718549#consent-types
      ad_storage: >
        啟用與廣告相關的儲存空間（例如 Cookie）。
      analytics_storage: >
        啟用與分析（例如造訪時間長度）相關的儲存空間（例如 Cookie）。
      functionality_storage: >
        啟用可支援網站或應用程式功能（例如語言設定）的儲存空間。
      personalization_storage: >
        啟用與個人化（例如影片推薦）相關的儲存空間。
      security_storage: >
        啟用與安全性（例如驗證功能、防範詐騙功能及其他使用者保護功能）相關的儲存空間。
